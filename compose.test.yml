services:
  postgres:
    container_name: hydrogen-api-test-postgres
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: hydrogen_test
      POSTGRES_USER: hydrogen_test
      POSTGRES_PASSWORD: hydrogen_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydrogen_test"]
      interval: 2s
      retries: 15

  redis:
    container_name: hydrogen-api-test-redis
    image: redis:8.4.0-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 15
